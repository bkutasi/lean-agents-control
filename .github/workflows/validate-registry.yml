name: Validate Registry on PR

# Contributor code must run only with a read-only token and no secrets.
# Never change this workflow back to pull_request_target while it checks out
# and executes pull-request code.

# T4 prune: registry automation removed by design (a27bed1).
# Neutralized to a no-op; the job is gated with if:false so no steps
# execute and the check always passes. File kept for history (preserves the
# check name for branch protection). Do NOT restore automation here.

on:
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-update:
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Registry automation pruned (no-op)
        run: echo "Registry automation pruned; passing as no-op."
